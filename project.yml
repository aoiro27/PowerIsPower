name: PowerIsPower
options:
  bundleIdPrefix: com.powerispower
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PowerIsPower:
    type: application
    platform: iOS
    sources: [PowerIsPower]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powerispower.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Power Is Power
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  PowerIsPowerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PowerIsPowerTests]
    dependencies:
      - target: PowerIsPower
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PowerIsPower:
    build:
      targets:
        PowerIsPower: all
    test:
      targets: [PowerIsPowerTests]
